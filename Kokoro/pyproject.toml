[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "primeos-kokoro-tts"
version = "0.1.0"
description = "Reusable local text-to-speech toolkit for PrimeOS using Kokoro-82M"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kokoro==0.9.4",
    "numpy>=2.0,<3",
    "soundfile>=0.13,<0.14",
]

[project.optional-dependencies]
japanese = ["misaki[ja]>=0.9.4"]
mandarin = ["misaki[zh]>=0.9.4"]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[project.scripts]
kokoro-tts = "primeos_tts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/primeos_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]
