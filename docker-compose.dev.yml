services:
  api:
    image: node:20-alpine
    container_name: prime-local-api
    working_dir: /app
    command: sh -c "test -f node_modules/express/package.json || npm install --workspaces=false --package-lock=false; exec node src/server.js"
    environment:
      HOST: 0.0.0.0
      PORT: 8280
      PRIME_ALLOW_DEMO_CREDENTIALS: "true"
      PRIME_ALLOW_DOCKER_DEMO_TRAFFIC: "true"
      PRIME_SESSION_SECRET: prime-os-local-dev-session-secret
      PRIME_ALLOWED_ORIGINS: http://127.0.0.1:5188,http://localhost:5188
    ports:
      - "127.0.0.1:8280:8280"
    volumes:
      - ./apps/api:/app
      - prime_api_dependencies:/app/node_modules
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: prime-local-web
    working_dir: /app
    command: sh -c "test -d node_modules/vite || npm install --workspaces=false; exec npm run dev -- --host 0.0.0.0 --port 5188 --strictPort"
    depends_on:
      - api
    environment:
      VITE_PRIME_ADMIN_API_BASE: http://127.0.0.1:8280
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5188:5188"
    volumes:
      - ./apps/web:/app
      - prime_web_node_modules:/app/node_modules
    restart: unless-stopped

  admin:
    image: node:20-alpine
    container_name: prime-local-admin
    working_dir: /app
    command: sh -c "test -d node_modules/vite || npm install --workspaces=false; exec npm run dev -- --host 0.0.0.0 --port 5174 --strictPort"
    depends_on:
      - api
    environment:
      PRIME_ADMIN_PROXY_TARGET: http://api:8280
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./apps/admin:/app
      - prime_admin_dependencies:/app/node_modules
    restart: unless-stopped

volumes:
  prime_api_dependencies:
  prime_web_node_modules:
  prime_admin_dependencies:
