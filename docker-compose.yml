services:
  web:
    build:
      context: ./apps/web
      args:
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:?Set Supabase project URL for the PrimeOS frontend build}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY:?Set Supabase anon/publishable key for the PrimeOS frontend build}"
        VITE_PRIME_ADMIN_API_BASE: "${VITE_PRIME_ADMIN_API_BASE:-}"
    container_name: prime-os-prime-web
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
    container_name: prime-os-admin-web
    depends_on:
      - api
    ports:
      - "5174:80"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: prime-os-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      PRIME_ALLOW_DEMO_CREDENTIALS: "${PRIME_ALLOW_DEMO_CREDENTIALS:-false}"
      PRIME_ALLOWED_ORIGINS: "${PRIME_ALLOWED_ORIGINS:?Set comma-separated frontend origins, for example https://prime.example.com,https://admin-prime.example.com}"
      PRIME_SESSION_SECRET: "${PRIME_SESSION_SECRET:?Set a unique secret of at least 32 characters}"
      PRIME_ADMIN_EMAIL: "${PRIME_ADMIN_EMAIL:?Set staging admin email}"
      PRIME_ADMIN_PASSWORD: "${PRIME_ADMIN_PASSWORD:?Set staging admin password}"
      PRIME_USER_EMAIL: "${PRIME_USER_EMAIL:?Set staging user email}"
      PRIME_USER_PASSWORD: "${PRIME_USER_PASSWORD:?Set staging user password}"
    expose:
      - "8080"
    volumes:
      - ./apps/api/data:/app/data
    restart: unless-stopped
